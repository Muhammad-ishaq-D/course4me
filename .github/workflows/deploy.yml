# Builds the site with its SEO extras and publishes it to the `deploy` branch,
# which Hostinger serves as-is (no build on Hostinger's side).
#
# `npm run build:seo` needs Chrome (pre-installed on GitHub's Ubuntu runners) to
# pre-render pages for search engines and link previews; it also writes the full
# sitemap and the old-address redirects from the live API.
#
# Runs on every push to main, every night (so new courses, licences, locations
# and articles reach the sitemap without a code change), and on demand from the
# Actions tab. If the build or any check fails, nothing is published and the
# last good version stays live.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and pre-render
        run: npm run build:seo
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Check the build before publishing
        run: |
          set -e
          urls=$(grep -c "<loc>" dist/sitemap.xml)
          snapshots=$(find dist/prerender -name index.html | wc -l)
          redirects=$(grep -c "R=301" dist/.htaccess)
          echo "sitemap URLs: $urls, snapshots: $snapshots, redirect rules: $redirects"
          # Well below today's numbers (50 / 60+ / 50+): a sharp drop means the
          # API was down or rate-limited during the build, so do not publish.
          test "$urls" -ge 30
          test "$snapshots" -ge 30
          test "$redirects" -ge 10
          test -f dist/prerender/index.html

      # Hostinger's Vite preset always runs `npm run build` and serves `dist/`.
      # The branch therefore carries the finished site in dist/ plus a package.json
      # whose build script does nothing, so Hostinger's settings stay as they are
      # apart from the branch name.
      - name: Publish to the deploy branch
        run: |
          mkdir publish
          mv dist publish/dist
          cd publish
          cat > package.json <<'EOF'
          {
            "name": "course4me-deploy",
            "version": "1.0.0",
            "private": true,
            "description": "Pre-built site published by GitHub Actions from main. Do not edit; push to main instead.",
            "scripts": {
              "build": "node -e \"console.log('Already built by GitHub Actions - serving dist/')\""
            }
          }
          EOF
          cat > package-lock.json <<'EOF'
          {
            "name": "course4me-deploy",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": { "name": "course4me-deploy", "version": "1.0.0" }
            }
          }
          EOF
          printf '# Built site\n\nGenerated by .github/workflows/deploy.yml on main. Do not commit here.\n' > README.md
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7} ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deploy
