<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/favicon.svg" />
    <link rel="apple-touch-icon" href="/og-image.png" />
    <meta name="theme-color" content="#0B1D33" />

    <!-- Early connections to the API, fonts and image CDNs -->
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- Loaded without blocking the first paint -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..900&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <!--
      Defaults for crawlers that do not run JavaScript. The app removes
      these on start-up (main.jsx) and each page renders its own.
    -->
    <title data-seo-default>courses4me - SIA Security Courses, Licences &amp; Jobs in the UK</title>
    <meta
      data-seo-default
      name="description"
      content="Book accredited SIA security courses, first aid and professional training at centres across the UK. Get your SIA licence, find security jobs and start your career with courses4me."
    />
    <meta data-seo-default name="robots" content="index, follow, max-image-preview:large" />
    <link data-seo-default rel="canonical" href="https://courses4me.co.uk/" />

    <meta data-seo-default property="og:site_name" content="courses4me" />
    <meta data-seo-default property="og:locale" content="en_GB" />
    <meta data-seo-default property="og:type" content="website" />
    <meta data-seo-default property="og:url" content="https://courses4me.co.uk/" />
    <meta
      data-seo-default
      property="og:title"
      content="courses4me - SIA Security Courses, Licences & Jobs in the UK"
    />
    <meta
      data-seo-default
      property="og:description"
      content="Book accredited SIA security courses, first aid and professional training at centres across the UK. Get your SIA licence, find security jobs and start your career."
    />
    <meta data-seo-default property="og:image" content="https://courses4me.co.uk/og-image.png" />

    <meta data-seo-default name="twitter:card" content="summary_large_image" />
    <meta data-seo-default name="twitter:url" content="https://courses4me.co.uk/" />
    <meta
      data-seo-default
      name="twitter:title"
      content="courses4me - SIA Security Courses, Licences & Jobs in the UK"
    />
    <meta
      data-seo-default
      name="twitter:description"
      content="Book accredited SIA security courses, first aid and professional training at centres across the UK. Get your SIA licence, find security jobs and start your career."
    />
    <meta data-seo-default name="twitter:image" content="https://courses4me.co.uk/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <h1>courses4me - SIA Security Courses, Licences &amp; Jobs in the UK</h1>
      <p>
        Accredited SIA security training, first aid and professional courses at
        training centres across the UK. Please enable JavaScript to book a course.
      </p>
      <ul>
        <li><a href="/courses">All courses</a></li>
        <li><a href="/licences">SIA licences</a></li>
        <li><a href="/locations">Training locations</a></li>
        <li><a href="/careers">Careers</a></li>
        <li><a href="/blog">Blog</a></li>
        <li><a href="/faqs">FAQs</a></li>
      </ul>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
